<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空调选购数据库 - 前10品牌型号参数</title>
<link rel="stylesheet" href="styles.css?v=__VERSION__">
</head>
<body>
<header>
  <h1>❄️ 空调选购数据库</h1>
  <p class="subtitle">中国空调前10品牌 · 多源型号参数（太平洋热度 + ZOL + 京东销量）· 数据每日更新</p>
</header>

<main>
  <section class="controls">
    <div class="filter-bar" id="filter-bar"></div>
    <div class="range-bar" id="numeric-ranges"></div>
    <div class="sort-bar">
      <div class="sort-levels" id="sort-levels"></div>
      <button id="add-sort-level" class="add-sort-btn">＋ 添加排序关键字</button>
      <span class="result-count" id="result-count"></span>
    </div>
  </section>

  <section class="table-wrap">
    <table id="data-table">
      <thead><tr id="table-head"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </section>
  <!-- 浮动横向滚动条（在 wrap 外：sticky bottom:0 相对页面滚动容器，钉在视口底部；
       hover 表格或滚动条时浮现，任意竖向位置可横向滑动） -->
  <div class="table-scrollbar" id="table-scrollbar"><div class="table-scrollbar-inner"></div></div>

  <footer>
    <p>数据来源：太平洋电脑网（最热门排序）、中关村在线、京东（15日销量榜）。价格与库存随时变化，站点仅提供结构化选购线索，最终信息以来源页面为准。</p>
  </footer>
</main>

<script src="app.js?v=__VERSION__"></script>
</body>
</html>
