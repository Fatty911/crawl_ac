name: Hardware Enrich

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Merge and Filter"]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: hardware-enrich
  cancel-in-progress: false

jobs:
  enrich:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest published release
        run: |
          mkdir -p release crawl_state
          gh release download data-latest --pattern ac-latest.json --dir release || { echo "no release yet"; exit 0; }

      - name: Download previous hardware cache
        continue-on-error: true
        run: |
          python scripts/download_latest_crawler_artifact.py             --repo "$GITHUB_REPOSITORY"             --workflow hardware-enrich.yml             --artifact-prefix hardware-cache-             --output crawl_state/hardware_cache.json             --min-records 1 || echo "no previous hardware cache"

      - name: AI-extract hardware facts
        continue-on-error: true
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          VOLCENGINE_AGENT_PLAN_API_KEY: ${{ secrets.VOLCENGINE_AGENT_PLAN_API_KEY }}
        run: |
          if [ -f release/ac-latest.json ]; then
            python scripts/ai_extract_hardware.py               --input release/ac-latest.json               --output release/ac-latest-hardware.json               --max-items 100
          fi

      - name: Upload hardware cache for next run
        continue-on-error: true
        uses: actions/upload-artifact@main
        with:
          name: hardware-cache-${{ github.run_id }}
          path: crawl_state/hardware_cache.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish enriched payload back to release
        continue-on-error: true
        run: |
          if [ -f release/ac-latest-hardware.json ]; then
            # 版本保护：若 release 已被更新的 merge 覆盖（generated_at 不同），
            # 跳过回写，避免旧数据覆盖新数据
            python - <<'PY'
          import json, os, urllib.request
          local = json.load(open("release/ac-latest.json", encoding="utf-8"))
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/releases/tags/data-latest" % os.environ["GITHUB_REPOSITORY"],
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "User-Agent": "hardware-enrich", "Accept": "application/vnd.github+json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  meta = json.loads(resp.read().decode("utf-8"))
              remote_asset = next(
                  (a for a in meta.get("assets", []) if a["name"] == "ac-latest.json"), None)
              if remote_asset:
                  areq = urllib.request.Request(remote_asset["browser_download_url"],
                                                headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(areq, timeout=60) as aresp:
                      remote = json.loads(aresp.read().decode("utf-8"))
                  if remote.get("generated_at") != local.get("generated_at"):
                      print("SKIP publish: release has newer generated_at "
                            f"({remote.get('generated_at')} != {local.get('generated_at')})")
                      raise SystemExit(0)
              print("release matches local payload; proceeding with publish")
          except SystemExit:
              raise
          except Exception as exc:
              print(f"version check failed ({exc}); proceeding with publish")
          PY
            gh release upload data-latest release/ac-latest.json \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh workflow run deploy-pages.yml --ref main
          fi
