name: Deploy Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Merge and Filter"]
    types: [completed]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest verified Release
        run: |
          mkdir -p release
          gh release download data-latest \
            --pattern ac-latest.json \
            --dir release || { echo "no data-latest release yet"; exit 0; }

      - name: Prepare Pages data
        run: |
          if [ -f release/ac-latest.json ]; then
            python scripts/prepare_pages_payload.py \
              --input release/ac-latest.json \
              --config config/filter_conditions.json \
              --docs-dir docs
          else
            echo "no release data; skipping data preparation"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@main

      - name: Verify deployed manifest
        if: steps.deployment.outputs.page_url != ''
        env:
          MANIFEST_URL: ${{ steps.deployment.outputs.page_url }}data/manifest.json
          EXPECTED_COUNT: ${{ env.EXPECTED_COUNT }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ["MANIFEST_URL"]
          with urllib.request.urlopen(url, timeout=60) as resp:
              deployed = json.loads(resp.read().decode("utf-8"))
          staged_path = "docs/data/manifest.json"
          if not os.path.exists(staged_path):
              print("no staged manifest (no release data); skip readback")
              raise SystemExit(0)
          with open(staged_path, encoding="utf-8") as handle:
              staged = json.load(handle)
          if deployed.get("generated_at") != staged.get("generated_at"):
              raise SystemExit(
                  "deployed manifest does not match staged release: "
                  f"{deployed.get('generated_at')} vs {staged.get('generated_at')}"
              )
          print(f"deployed manifest verified: {deployed.get('count')} rows")
          PY
