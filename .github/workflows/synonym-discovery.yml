name: Synonym Discovery

# 同义词自发现自优化：merge 后扫描同一机型（identity）不同源的字段写法差异，
# 由 Agent（opencode run）判定真同义词并沉淀为确定性归一规则（改 merge_data.py
# 的归一函数），评审后提交并触发 merge 重跑验证——冲突清零后自动停止。
# 覆盖用户要求："匹数 P/匹、能效 新一级/新一级能效、铜管 2排/双排 都应该归并，推进 action 自发现自优化"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2,14 * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: synonym-discovery
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
  GITHUB_TOKEN: ${{ secrets.ACTION_PAT || github.token }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download raw artifacts and published baseline
        run: |
          mkdir -p data/raw/pconline data/raw/suning data/raw/zol data/raw/jd dist
          set +e
          for spec in "crawl-pconline.yml:pconline-data-:data/raw/pconline/latest.json:50" \
                      "crawl-suning.yml:suning-data-:data/raw/suning/latest.json:50" \
                      "crawl-zol.yml:zol-data-:data/raw/zol/latest.json:50" \
                      "crawl-jd-tower.yml:jd-tower-data-:data/raw/jd/tower/latest.json:5"; do
            IFS=: read -r wf prefix out minr <<< "$spec"
            mkdir -p "$(dirname "$out")"
            python scripts/download_latest_crawler_artifact.py \
              --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
              --artifact-prefix "$prefix" --output "$out" --min-records "$minr" \
              2>/dev/null
          done
          set -e
          gh release download data-latest --pattern ac-latest.json --dir dist || true
          echo "AVAILABLE=$(ls data/raw/*/latest.json data/raw/jd/tower/latest.json 2>/dev/null | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Detect synonym conflicts
        id: detect
        env:
          AVAILABLE: ${{ env.AVAILABLE }}
        run: |
          python scripts/analysis/merge_evidence_report.py \
            --raw $AVAILABLE \
            --merged dist/ac-latest.json \
            --rejected dist/ac-latest.json \
            --output conflicts_report.json
          # 注：--rejected 用 merged 占位（rejection_reasons 统计不完整不影响
          # synonym_conflicts 检测——它只消费 --raw；merge run 的 rejected 未上传 artifact）
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, 'scripts')
          from merge_data import normalize_hp, normalize_energy_grade, normalize_coil_rows

          report = json.load(open('conflicts_report.json', encoding='utf-8'))
          conflicts = report.get('synonym_conflicts', [])
          print(f'同义词冲突候选(原始): {len(conflicts)}')

          # 确定性预筛：已有归一规则能解释的冲突直接排除（如 1.5P vs 1.5匹——
          # normalize_hp 已归并，不需要 Agent 判定）
          NORMALIZERS = {
              "hp": normalize_hp,
              "energy_grade": normalize_energy_grade,
              "coil_rows": normalize_coil_rows,
          }
          novel = []
          for c in conflicts:
              norm = NORMALIZERS.get(c["field"])
              if norm:
                  normed = {norm(v) for v in c["values"]}
                  if len(normed) <= 1:
                      continue  # 已有规则覆盖
              novel.append(c)
          print(f'预筛后候选: {len(novel)}')

          # 模式聚类：同 (field, values) 合并为一条规则候选（附机型示例）
          by_pattern = {}
          for c in novel:
              key = (c["field"], tuple(c["values"]))
              by_pattern.setdefault(key, []).append(c["identity"])
          patterns = [
              {"field": f, "values": list(v), "examples": ids[:5],
               "model_count": len(ids)}
              for (f, v), ids in sorted(by_pattern.items(),
                                        key=lambda kv: -len(kv[1]))
          ]
          print(f'模式候选: {len(patterns)}')
          if not patterns:
              open('.env_out', 'w').write('no_conflicts=true\n')
              print('NO_CONFLICTS=1')
          else:
              with open('conflicts.json', 'w', encoding='utf-8') as f:
                  json.dump(patterns, f, ensure_ascii=False, indent=1)
              print('conflicts saved')
          EOF
          if [ -f .env_out ]; then
            cat .env_out >> "$GITHUB_ENV"
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            echo "冲突数: $(python -c "import json; print(len(json.load(open('conflicts.json', encoding='utf-8'))))")"
          fi

      - name: Upload conflicts report (for Hermes/VPS manual closure)
        if: steps.detect.outputs.has_conflicts == 'true'
        # opencode+火山 AgentPlan 组合在 runner 上无法可靠完成 AI 判定（8 轮实测：
        # deepseek-v4-flash 首响应 40min+、kimi-k3 plan/build agent 均悬挂/回显），
        # 判定由 Hermes Agent（合规 Agent 工具）消费本 artifact 后确定性应用。
        uses: actions/upload-artifact@v4
        with:
          name: synonym-conflicts-${{ github.run_id }}
          path: |
            conflicts.json
            conflicts_report.json
          retention-days: 7
