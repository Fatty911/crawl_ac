name: Merge and Filter

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Crawl ZOL", "Crawl JD", "Crawl PConline", "Crawl Suning", "Crawl Leader", "Crawl Gree", "Crawl JD Tower"]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: merge-and-filter
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for sibling crawler artifacts
        if: github.event_name == 'workflow_run'
        run: |
          echo "Waiting 60s for sibling crawler artifacts to finish uploading..."
          sleep 60

      - name: Download latest complete crawler artifacts
        id: artifacts
        run: |
          mkdir -p data/raw/pconline data/raw/zol data/raw/jd data/raw/jd/tower data/raw/suning data/raw/leader data/raw/gree
          echo "skip=false" >> "$GITHUB_OUTPUT"
          set +e
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-pconline.yml \
            --artifact-prefix pconline-data- \
            --output data/raw/pconline/latest.json \
            --min-records 50 \
            2> >(tee "$RUNNER_TEMP/pconline-artifact.err" >&2)
          pconline_status=$?
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-zol.yml \
            --artifact-prefix zol-data- \
            --output data/raw/zol/latest.json \
            --min-records 50 \
            2> >(tee "$RUNNER_TEMP/zol-artifact.err" >&2)
          zol_status=$?
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-jd.yml \
            --artifact-prefix jd-data- \
            --output data/raw/jd/latest.json \
            --min-records 50 \
            2> >(tee "$RUNNER_TEMP/jd-artifact.err" >&2)
          jd_status=$?
          python scripts/download_latest_crawler_artifact.py             --repo "$GITHUB_REPOSITORY"             --workflow crawl-suning.yml             --artifact-prefix suning-data-             --output data/raw/suning/latest.json             --min-records 50             2> >(tee "$RUNNER_TEMP/suning-artifact.err" >&2)
          suning_status=$?
          gree_status=0
          python scripts/download_latest_crawler_artifact.py             --repo "$GITHUB_REPOSITORY"             --workflow crawl-gree.yml             --artifact-prefix gree-data-             --output data/raw/gree/latest.json             --min-records 5             2> >(tee "$RUNNER_TEMP/gree-artifact.err" >&2)
          gree_status=$?
          leader_status=0
          python scripts/download_latest_crawler_artifact.py             --repo "$GITHUB_REPOSITORY"             --workflow crawl-leader.yml             --artifact-prefix leader-data-             --output data/raw/leader/latest.json             --min-records 5             2> >(tee "$RUNNER_TEMP/leader-artifact.err" >&2)
          leader_status=$?
          jd_tower_status=0
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-jd-tower.yml \
            --artifact-prefix jd-tower-data- \
            --output data/raw/jd/tower/latest.json \
            --min-records 5 \
            2> >(tee "$RUNNER_TEMP/jd-tower-artifact.err" >&2)
          jd_tower_status=$?
          set -e

          if [ "$pconline_status" -ne 0 ] &&
             [ "$zol_status" -ne 0 ] &&
             [ "$jd_status" -ne 0 ] &&
             [ "$suning_status" -ne 0 ] &&
             grep -Fq "no unexpired artifact" "$RUNNER_TEMP/pconline-artifact.err" &&
             grep -Fq "no unexpired artifact" "$RUNNER_TEMP/zol-artifact.err" &&
             grep -Fq "no unexpired artifact" "$RUNNER_TEMP/jd-artifact.err"; then
            echo "No crawler artifacts are available; skipping merge and publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 至少一个源可用即可合并（不要求全部成功）
          AVAILABLE=""
          if [ "$pconline_status" -eq 0 ]; then AVAILABLE="$AVAILABLE data/raw/pconline/latest.json"; fi
          if [ "$zol_status" -eq 0 ]; then AVAILABLE="$AVAILABLE data/raw/zol/latest.json"; fi
          if [ "$jd_status" -eq 0 ]; then AVAILABLE="$AVAILABLE data/raw/jd/latest.json"; fi
          if [ "$jd_tower_status" -eq 0 ]; then AVAILABLE="$AVAILABLE data/raw/jd/tower/latest.json"; fi
          if [ "$leader_status" -eq 0 ]; then AVAILABLE="$AVAILABLE data/raw/leader/latest.json"; fi
          if [ "$gree_status" -eq 0 ]; then AVAILABLE="$AVAILABLE data/raw/gree/latest.json"; fi
          if [ "$suning_status" -eq 0 ]; then AVAILABLE="$AVAILABLE data/raw/suning/latest.json"; fi
          echo "AVAILABLE_ARTIFACTS=$AVAILABLE" >> "$GITHUB_ENV"

      - name: Download published baseline
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          mkdir -p baseline
          gh release download data-latest \
            --pattern ac-latest.json \
            --dir baseline || true

      - name: Merge, deduplicate, and enforce publication requirements
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          mkdir -p data/work dist
          python scripts/merge_data.py \
            $AVAILABLE_ARTIFACTS \
            --output data/work/candidate.json \
            --rejected-output data/work/rejected.json \
            --min-source-records 50

      - name: Preserve published baseline
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          python scripts/preserve_publish_baseline.py \
            --candidate data/work/candidate.json \
            --baseline baseline/ac-latest.json \
            --cache crawl_state/hardware_cache.json \
            --output dist/ac-latest.json

      - name: Verify no published identity or source regresses
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          python scripts/verify_publish_superset.py \
            --baseline baseline/ac-latest.json \
            --candidate dist/ac-latest.json
          python scripts/audit_pages_payload.py \
            --payload dist/ac-latest.json \
            --baseline baseline/ac-latest.json

      - name: Generate merge evidence report
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          python scripts/analysis/merge_evidence_report.py \
            --raw $AVAILABLE_ARTIFACTS \
            --merged dist/ac-latest.json \
            --rejected data/work/rejected.json \
            --output dist/merge-evidence-report.json

      - name: Create or update rolling data release
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          if gh release view data-latest >/dev/null 2>&1; then
            gh release edit data-latest \
              --title "Latest verified AC data" \
              --notes "Automated verified dataset from PConline, ZOL, and JD."
          else
            gh release create data-latest \
              --target main \
              --title "Latest verified AC data" \
              --notes "Automated verified dataset from PConline, ZOL, and JD."
          fi
          gh release upload data-latest \
            dist/ac-latest.json \
            dist/merge-evidence-report.json \
            --clobber

      - name: Trigger Pages deployment
        if: steps.artifacts.outputs.skip != 'true'
        run: gh workflow run deploy-pages.yml --ref main
