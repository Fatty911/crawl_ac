name: Synonym Discovery

# 同义词自发现自优化：merge 后扫描同一机型（identity）不同源的字段写法差异，
# 由 Agent（opencode run）判定真同义词并沉淀为确定性归一规则（改 merge_data.py
# 的归一函数），评审后提交并触发 merge 重跑验证——冲突清零后自动停止。
# 覆盖用户要求："匹数 P/匹、能效 新一级/新一级能效、铜管 2排/双排 都应该归并，推进 action 自发现自优化"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2,14 * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: synonym-discovery
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
  GITHUB_TOKEN: ${{ secrets.ACTION_PAT || github.token }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download raw artifacts and published baseline
        run: |
          mkdir -p data/raw/pconline data/raw/suning data/raw/zol data/raw/jd dist
          set +e
          for spec in "crawl-pconline.yml:pconline-data-:data/raw/pconline/latest.json:50" \
                      "crawl-suning.yml:suning-data-:data/raw/suning/latest.json:50" \
                      "crawl-zol.yml:zol-data-:data/raw/zol/latest.json:50" \
                      "crawl-jd-tower.yml:jd-tower-data-:data/raw/jd/tower/latest.json:5"; do
            IFS=: read -r wf prefix out minr <<< "$spec"
            mkdir -p "$(dirname "$out")"
            python scripts/download_latest_crawler_artifact.py \
              --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
              --artifact-prefix "$prefix" --output "$out" --min-records "$minr" \
              2>/dev/null
          done
          set -e
          gh release download data-latest --pattern ac-latest.json --dir dist || true
          echo "AVAILABLE=$(ls data/raw/*/latest.json data/raw/jd/tower/latest.json 2>/dev/null | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Detect synonym conflicts
        id: detect
        env:
          AVAILABLE: ${{ env.AVAILABLE }}
        run: |
          python scripts/analysis/merge_evidence_report.py \
            --raw $AVAILABLE \
            --merged dist/ac-latest.json \
            --rejected dist/ac-latest.json \
            --output conflicts_report.json
          # 注：--rejected 用 merged 占位（rejection_reasons 统计不完整不影响
          # synonym_conflicts 检测——它只消费 --raw；merge run 的 rejected 未上传 artifact）
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, 'scripts')
          from merge_data import normalize_hp, normalize_energy_grade, normalize_coil_rows

          report = json.load(open('conflicts_report.json', encoding='utf-8'))
          conflicts = report.get('synonym_conflicts', [])
          print(f'同义词冲突候选(原始): {len(conflicts)}')

          # 确定性预筛：已有归一规则能解释的冲突直接排除（如 1.5P vs 1.5匹——
          # normalize_hp 已归并，不需要 Agent 判定）
          NORMALIZERS = {
              "hp": normalize_hp,
              "energy_grade": normalize_energy_grade,
              "coil_rows": normalize_coil_rows,
          }
          novel = []
          for c in conflicts:
              norm = NORMALIZERS.get(c["field"])
              if norm:
                  normed = {norm(v) for v in c["values"]}
                  if len(normed) <= 1:
                      continue  # 已有规则覆盖
              novel.append(c)
          print(f'预筛后候选: {len(novel)}')

          # 模式聚类：同 (field, values) 合并为一条规则候选（附机型示例）
          by_pattern = {}
          for c in novel:
              key = (c["field"], tuple(c["values"]))
              by_pattern.setdefault(key, []).append(c["identity"])
          patterns = [
              {"field": f, "values": list(v), "examples": ids[:5],
               "model_count": len(ids)}
              for (f, v), ids in sorted(by_pattern.items(),
                                        key=lambda kv: -len(kv[1]))
          ]
          print(f'模式候选: {len(patterns)}')
          if not patterns:
              open('.env_out', 'w').write('no_conflicts=true\n')
              print('NO_CONFLICTS=1')
          else:
              with open('conflicts.json', 'w', encoding='utf-8') as f:
                  json.dump(patterns, f, ensure_ascii=False, indent=1)
              print('conflicts saved')
          EOF
          if [ -f .env_out ]; then
            cat .env_out >> "$GITHUB_ENV"
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            echo "冲突数: $(python -c "import json; print(len(json.load(open('conflicts.json', encoding='utf-8'))))")"
          fi

      - name: Set up Node.js + OpenCode CLI
        if: steps.detect.outputs.has_conflicts == 'true'
        uses: actions/setup-node@main
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        if: steps.detect.outputs.has_conflicts == 'true'
        # pin 1.18.11：@latest 新版 CLI 移除 --agent plan 参数（crawl_laptops 同坑）
        run: npm install --global opencode-ai@1.18.11

      - name: Agent judges synonym patterns (single-shot JSON)
        if: steps.detect.outputs.has_conflicts == 'true'
        env:
          VOLCENGINE_AGENT_PLAN_API_KEY: ${{ secrets.VOLCENGINE_AGENT_PLAN_API_KEY }}
        run: |
          # 火山 AgentPlan provider 配置（JSON 严格，禁止 YAML 折叠）；
          # 判定用 kimi-k3（快模型；deepseek-v4-flash 首响应 30-40 分钟超时）
          cat > opencode_config.json <<'EOF'
          {"provider":{"volcengine-agentplan":{"npm":"@ai-sdk/openai-compatible","options":{"baseURL":"https://ark.cn-beijing.volces.com/api/plan/v3","apiKey":"{env:VOLCENGINE_AGENT_PLAN_API_KEY}"},"models":{"kimi-k3":{"name":"Kimi K3 (AgentPlan)"}}}},"model":"volcengine-agentplan/kimi-k3","permission":{"edit":"allow","bash":"allow"}}
          EOF
          export OPENCODE_CONFIG_CONTENT="$(cat opencode_config.json)"
          cat > synonym_prompt.md <<'EOF'
          你是数据归一专家。分析 crawl_ac 仓库的同义词冲突候选（conflicts.json）——
          每个候选是一条模式：{field, values, examples, model_count}。

          对每条模式判定并输出严格 JSON（不要输出其它内容，禁止复述示例——只输出真实判定）：
          {"decisions":[{"field":"<字段>","values":["<写法1>","<写法2>"],"decision":"merge|skip","canonical":"<归并后值，skip 时省略>","rule":"<确定性规则描述>","confidence":0.0-1.0}]}

          判定规则：
          - decision=merge：写法差异同义词，给出 canonical（归并后值）+ rule（确定性规则描述）
          - decision=skip：真配置差异或解析错误（如 370匹、大X匹 vs X匹、1级 vs 3级）
          - 只对明确同义的归并（3P/3.0P->3匹、双排铜管->双排、新一级能效->新一级）
          - "1级" vs "新一级"：无法确认同源同参时保守 skip
          - 宁缺毋滥：不确定一律 skip
          EOF
          # timeout 600 保护：opencode 进程输出后可能悬挂（已知行为）
          timeout 600 opencode run --pure --agent plan --model volcengine-agentplan/kimi-k3 \
            "判定同义词模式并输出 JSON 决策" --file synonym_prompt.md --file conflicts.json \
            --print-logs > agent_output.txt 2>&1
          OC_EXIT=$?
          if [ "$OC_EXIT" -ne 0 ] && [ "$OC_EXIT" -ne 124 ]; then
            echo "::error::opencode Agent 判定失败 (exit $OC_EXIT)"
            exit 1
          fi
          tail -40 agent_output.txt

      - name: Apply normalization rules deterministically
        if: steps.detect.outputs.has_conflicts == 'true'
        run: |
          python scripts/synonym_apply_rules.py agent_output.txt
          git diff --stat

      - name: Run full tests
        if: steps.detect.outputs.has_conflicts == 'true'
        run: python -m pytest tests/ -q 2>&1 | tail -3

      - name: Commit and trigger merge re-run
        if: steps.detect.outputs.has_conflicts == 'true'
        run: |
          if git diff --quiet; then
            echo "无改动（Agent 判定全部为真差异）"
            exit 0
          fi
          git config user.name "synonym-discovery-bot"
          git config user.email "xuerui911@gmail.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add scripts/merge_data.py tests/test_merge_data.py
          git commit -m "feat: 同义词归一规则（AI 自发现沉淀）[skip ci]

          来源：Synonym Discovery 自动扫描同一机型不同源字段写法差异，
          Agent（opencode run）判定真同义词后沉淀确定性规则。"
          git push origin main
          gh workflow run merge-and-filter.yml --repo ${{ github.repository }}
